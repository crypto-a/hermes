{% extends "base/base.html" %}
{% block title %}Activation error · Hermes{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto mt-24 bg-white shadow rounded-xl p-8 text-center">
  <h2 class="text-2xl font-semibold mb-4">Uh-oh…</h2>
  <p class="text-gray-600">
    That activation link is invalid or has expired.
  </p>
  <a href="{% url 'accounts:register' %}"
     class="mt-6 inline-block rounded-md bg-indigo-600 px-3.5 py-2.5 text-sm
            font-semibold text-white shadow hover:bg-indigo-500">
    Register again
  </a>
</div>
{% endblock %}
