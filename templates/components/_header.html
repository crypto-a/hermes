<header class="absolute inset-x-0 top-0 z-50 bg-white/60 backdrop-blur-lg">
  <nav class="flex items-center justify-between p-6 lg:px-8 max-w-7xl mx-auto" aria-label="Global">
    <div class="flex lg:flex-1">
      <a href="{% url 'main:home' %}" class="-m-1.5 p-1.5 flex items-center gap-2">
        <img class="h-8 w-auto"
             src="https://tailwindcss.com/plus-assets/img/logos/mark.svg?color=indigo&shade=600"
             alt="Hermes logo">
        <span class="sr-only">Hermes</span>
      </a>
    </div>

    <div class="hidden lg:flex lg:gap-x-12">
      <a href="#" class="text-sm font-semibold text-gray-900">Product</a>
      <a href="#" class="text-sm font-semibold text-gray-900">Features</a>
      <a href="#" class="text-sm font-semibold text-gray-900">Marketplace</a>
      <a href="#" class="text-sm font-semibold text-gray-900">Company</a>
    </div>

    <div class="hidden lg:flex lg:flex-1 lg:justify-end">
      {% if request.user.is_authenticated %}
        <a href="{% url 'dashboard:index' %}" class="text-sm font-semibold text-gray-900">
          Dashboard <span aria-hidden="true">→</span>
        </a>
      {% else %}
        <a href="{% url 'accounts:login' %}" class="text-sm font-semibold text-gray-900">
          Log&nbsp;in <span aria-hidden="true">→</span>
        </a>
      {% endif %}
    </div>
  </nav>
</header>
