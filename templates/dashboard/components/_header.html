<header class="absolute inset-x-0 top-0 z-50 bg-white/60 backdrop-blur-lg">
  <nav class="flex items-center justify-between p-6 lg:px-8 max-w-7xl mx-auto" aria-label="Global">

    <!-- logo + site name -->
    <div class="flex lg:flex-1 items-center gap-2">
      <a href="{% url 'main:home' %}" class="flex items-center gap-2">
        <img
          class="h-8 w-auto"
          src="https://tailwindcss.com/plus-assets/img/logos/mark.svg?color=indigo&shade=600"
          alt="Hermes logo">
        <span class="text-xl font-bold text-black">Hermes</span>
      </a>
    </div>

    <!-- profile menu -->
    {% if request.user.is_authenticated %}
      <div class="relative lg:flex lg:flex-1 lg:justify-end">
        <button id="profile-menu-button" type="button"
                class="flex items-center focus:outline-none"
                aria-haspopup="true" aria-expanded="false"
                onclick="document.getElementById('profile-dropdown').classList.toggle('hidden')">
          <img
            class="h-8 w-8 rounded-full"
            src="{{ request.user.profile.image.url|default:'https://via.placeholder.com/150' }}"
            alt="{{ request.user.username }}’s avatar">
          <span class="ml-2 text-sm font-medium text-gray-900">{{ request.user.username }}</span>
          <svg class="ml-1 h-4 w-4 text-gray-600" xmlns="http://www.w3.org/2000/svg" fill="none"
               viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M19 9l-7 7-7-7"/>
          </svg>
        </button>

        <!-- dropdown -->
        <div id="profile-dropdown"
             class="hidden origin-top-right absolute right-0 top-full mt-2 w-48 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5"
             role="menu" aria-orientation="vertical" aria-labelledby="profile-menu-button">
          <a href="{% url 'accounts:settings' %}"
             class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100"
             role="menuitem">
            Settings
          </a>
          <form method="post" action="{% url 'accounts:logout' %}">
            {% csrf_token %}
            <button type="submit"
                    class="w-full text-left block px-4 py-2 text-sm text-red-600 hover:bg-gray-100"
                    role="menuitem">
              Log out
            </button>
          </form>
        </div>
      </div>
    {% endif %}

  </nav>
</header>
