<!-- dashboard/components/_category_slider.html -->
<div class="_category_slider flex justify-between bg-gray-200 rounded-full p-2 mt-4">
  {% for cat in categories %}
    {% with idx=forloop.counter0 %}
      <button type="button"
              data-category="{{ cat|lower }}"
              class="flex-1 text-xs md:text-sm font-medium py-1.5 rounded-full transition
                     {% if idx == 0 %}bg-white shadow{% endif %}">
        {{ cat }}
      </button>
    {% endwith %}
  {% endfor %}
</div>

<script>
/* Very light JS to toggle the active pill */
document.querySelectorAll('._category_slider button').forEach(btn => {
  btn.onclick = () => {
    btn.parentElement.querySelectorAll('button').forEach(b => {
      b.classList.remove('bg-white','shadow');
    });
    btn.classList.add('bg-white','shadow');
    // TODO: emit an event or call your fetch-emails logic
  };
});
</script>
