<!-- dashboard/components/_searchbar.html -->
<div class="_searchbar flex items-center gap-3 bg-white shadow rounded-xl px-4 py-2">
  <svg class="w-5 h-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none"
       viewBox="0 0 24 24" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 104.5 4.5a7.5 7.5 0 0012.15 12.15z"/>
  </svg>
  <input type="search" placeholder="Search email"
         class="w-full bg-transparent focus:outline-none text-sm"/>
  <button id="toggle-btn" class="rounded-md bg-indigo-600 px-3 py-1.5 text-xs font-medium text-white hover:bg-indigo-500 w-28 h-8">
  <span id="toggle-label">Unread</span>
    </button>

</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const btn   = document.getElementById('toggle-btn');
    const label = document.getElementById('toggle-label');
    let showUnread = false;

    btn.addEventListener('click', () => {
      showUnread = !showUnread;
      label.textContent = showUnread ? 'All' : 'Unread';

      // re-dispatch your filter-updated event if you need it:
      const searchValue = document.querySelector('input[type="search"]').value;
      btn.closest('._searchbar').dispatchEvent(new CustomEvent('filter-updated', {
        detail: { query: searchValue, showUnread }
      }));
    });
  });
</script>
